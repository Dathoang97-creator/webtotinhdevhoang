<script>
(() => {
  // ✎ CHỈNH Ở ĐÂY: tên người nhận và cách xưng hô
  const NAME = '';                 // ví dụ 'Linh'. Để trống thì dùng chữ "bạn"
  const ME = 'mình', YOU = 'bạn';  // có thể đổi thành 'anh' / 'em'

  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const T = (s) => s.replace(/\{Me\}/g, cap(ME)).replace(/\{me\}/g, ME).replace(/\{You\}/g, cap(YOU)).replace(/\{you\}/g, YOU).replace(/\{name\}/g, NAME || YOU);

  // ✎ LỜI NHẮN: sửa tuỳ ý. {me} {you} {name} sẽ tự đổi theo cách xưng hô ở trên
  const TXT = {
    title: 'Gửi {name}',
    lead: '{Me} có vài điều chưa kịp nói thành lời.',
    note: 'Hãy đeo tai nghe và đi cùng {me} một chút nhé ♪',
    holdHint: 'Đặt ngón tay lên trái tim, rồi giữ lại nhé',
    holdMore: 'Giữ tiếp nhé…',
    hold: [
      'Đây là nhịp tim của {me}.',
      'Nó vẫn đập rất bình yên… cho đến khi {me} nghĩ về {you}.',
      'Rồi nó đập nhanh hơn mỗi khi tin nhắn của {you} hiện lên.',
      'Giống như lúc này vậy đó.'
    ],
    holdDone: 'Hôm nay, {me} muốn kể hết cho {you} nghe.',
    weather: [
      'Những ngày nắng, {me} muốn cùng {you} đi dạo thật chậm.',
      'Không cần đi đâu xa. Chỉ cần được đi bên cạnh {you}, là đủ.',
      'Những ngày mưa, {me} muốn là chiếc ô của {you}.',
      'Còn những ngày {you} mệt, {me} muốn là bờ vai để {you} tựa vào.',
      'Nên dù nắng hay mưa, {me} cũng chỉ muốn đi bên cạnh {you} thôi.'
    ],
    wishIntro: 'Người ta bảo, thấy sao băng thì hãy ước một điều. {Me} gửi {you} ba điều ước nhé.',
    wishBtn: ['Gửi điều ước thứ nhất', 'Gửi điều ước thứ hai', 'Gửi điều ước cuối cùng'],
    wishes: [
      'Ước cho {you} luôn bình an, dù ở bất cứ đâu.',
      'Ước cho nụ cười của {you} đừng bao giờ tắt.',
      'Và ước, người đi cùng {you} những ngày sau này… là {me}.'
    ],
    gather: 'Mỗi ngọn đèn là một lần {me} nghĩ đến {you}.',
    ask: '{You} ơi, làm người yêu {me} nhé?',
    soft: '{Me} sẽ chờ, bao lâu cũng được 🤍',
    endH: 'Cảm ơn {name}',
    endLead: 'Cảm ơn vì đã đến bên {me}. {You} là điều dịu dàng nhất trong những ngày của {me}, và từ hôm nay, {me} sẽ ở cạnh {you}, dù nắng hay mưa.'
  };

  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = (p) => 1 - Math.pow(1 - p, 3);
  const nowS = () => performance.now() / 1000;
  document.title = T(TXT.title);
  $('title').textContent = T(TXT.title); $('introLead').textContent = T(TXT.lead); $('introNote').textContent = T(TXT.note);
  $('askQ').textContent = T(TXT.ask); $('endH').textContent = T(TXT.endH); $('endLead').textContent = T(TXT.endLead);

  const cv = $('c'), ctx = cv.getContext('2d');
  let W, H, HOR, U, stars = [], flies = [], ripples = [];
  function resize() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; HOR = H * .76; U = Math.min(W, H);
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 5200) }, () => ({ x: rnd(0, W), y: rnd(0, HOR * .92), r: rnd(.4, 1.5), ph: rnd(0, 6.28), sp: rnd(.6, 2) }));
    flies = Array.from({ length: 30 }, () => ({ x: rnd(0, W), y: rnd(H * .4, H), ph: rnd(0, 6.28), sp: rnd(.15, .4) }));
    ripples = Array.from({ length: 26 }, () => ({ x: rnd(0, W), y: rnd(HOR + 4, H), w: rnd(14, 60), ph: rnd(0, 6.28) }));
  }
  addEventListener('resize', resize); resize();

  // heart curve (centred on 0)
  const hp = (t) => [16 * Math.pow(Math.sin(t), 3), 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5];
  const geo = () => ({ cx: W / 2, cy: H * .34, s: Math.min(W * .62, H * .5) / 32 });
  const orbGeo = () => ({ cx: W / 2, cy: H * .36, s: Math.min(W * .5, H * .32) / 32 });
  function heartPath(cx, cy, s) {
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) { const [x, y] = hp(i / 80 * 6.2832); i ? ctx.lineTo(cx + x * s, cy - y * s) : ctx.moveTo(cx + x * s, cy - y * s); }
    ctx.closePath();
  }
  function glow(x, y, r, rgb, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }

  function drawLantern(x, y, s, f, vis, t, ph) {
    if (vis <= .01) return;
    ctx.save(); ctx.globalAlpha = clamp(vis);
    glow(x, y, s * 3.2 * (1 + Math.sin(t * 5 + ph) * .05), '255,170,70', .5 * f);
    ctx.translate(x, y); const w = s * .62, h = s * .8;
    ctx.beginPath(); ctx.moveTo(-w * .8, h * .5);
    ctx.bezierCurveTo(-w * 1.15, h * .05, -w * .7, -h * .75, 0, -h * .78);
    ctx.bezierCurveTo(w * .7, -h * .75, w * 1.15, h * .05, w * .8, h * .5); ctx.closePath();
    const g = ctx.createLinearGradient(0, -h, 0, h * .5), a = .3 + .7 * f;
    g.addColorStop(0, `rgba(255,${Math.round(140 + f * 70)},${Math.round(60 + f * 40)},${a})`); g.addColorStop(1, `rgba(255,196,120,${a})`);
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = `rgba(255,222,176,${.35 + .5 * f})`; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, h * .52, w * .62, h * .07, 0, 0, 6.283); ctx.fillStyle = `rgba(255,242,205,${.4 + .6 * f})`; ctx.fill();
    ctx.restore();
  }

  // ---------- state ----------
  let state = 'intro', lock = false, wishIdx = 0;
  let holding = false, prog = 0, beatT = 0, pulse = 0, orbA = 0, rings = [], holdShown = -1;
  let warm = 0, warmT = 0, storm = 0, stormT = 0, umb = 0, umbT = 0, rainOn = false, rain = [], splashes = [];
  let shoots = [], gT0 = null, pts = [], petals = [], petalsUntil = 0, boats = [], boatsUntil = 0, rockets = [], sparks = [], flashes = [];

  function makePoints() {
    pts = []; const k0 = reduce ? .05 : 1;
    for (let i = 0; i < 150; i++) {
      const lan = i < 40 || (i >= 100 && i < 118), inner = i >= 100; let t, k = 1;
      t = i < 40 ? i / 40 * Math.PI * 2 : rnd(0, Math.PI * 2); if (inner) k = rnd(.2, .85);
      const [hx, hy] = hp(t);
      pts.push({ hx: hx * k, hy: hy * k, lan, size: U * rnd(.03, .044), sx: rnd(0, W), sy: lan ? rnd(HOR, H) : rnd(-30, HOR * .55), delay: rnd(0, 2) * k0, dur: rnd(3, 4.2) * k0, r: rnd(1.4, 2.8),
        ph: rnd(0, 6.28), rose: Math.random() < .35, free: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 });
    }
  }

  // ---------- river boats + fireworks ----------
  const PAL = ['255,120,150', '255,200,110', '255,255,255', '140,200,255', '255,150,220'];
  const BOAT_RGB = ['255,150,175', '255,190,100', '255,170,120'];
  function spawnBoat() {
    const d = Math.random();
    boats.push({ x: -30, y: HOR + 12 + d * (H - HOR - 50), s: 8 + d * 14, vx: 14 + d * 26, ph: rnd(0, 6.28), vis: 0, rgb: BOAT_RGB[Math.floor(rnd(0, 3))] });
  }
  function drawBoat(b, y) {
    const s = b.s;
    ctx.save(); ctx.globalAlpha = b.vis;
    glow(b.x, y - s * .3, s * 3.2, b.rgb, .4); glow(b.x, y + s * .9, s * 2.2, b.rgb, .14);
    ctx.fillStyle = 'rgba(120,60,40,.9)'; ctx.beginPath(); ctx.ellipse(b.x, y, s * .9, s * .28, 0, 0, 6.283); ctx.fill();
    for (let i = -2; i <= 2; i++) {
      ctx.save(); ctx.translate(b.x, y - s * .12); ctx.rotate(i * .42);
      ctx.fillStyle = `rgba(${b.rgb},.95)`; ctx.beginPath(); ctx.ellipse(0, -s * .38, s * .2, s * .44, 0, 0, 6.283); ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,244,214,.95)'; ctx.beginPath(); ctx.arc(b.x, y - s * .22, s * .16, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  function launch(type) {
    const x = rnd(.18, .82) * W;
    rockets.push({ x, y: HOR, tx: x + rnd(-20, 20), ty: rnd(.14, .4) * H, t0: nowS(), dur: rnd(.6, .85), type, rgb: type === 'heart' ? '255,120,160' : PAL[Math.floor(rnd(0, PAL.length))] });
    music.whistle();
  }
  function explode(r) {
    flashes.push({ x: r.tx, y: r.ty, t0: nowS(), rgb: r.rgb }); music.boom();
    const n = r.type === 'heart' ? 90 : 70, sc = U / 390;
    for (let i = 0; i < n; i++) {
      let vx, vy; const a = rnd(0, 6.283);
      if (r.type === 'heart') { const [hx, hy] = hp(i / n * 6.283); vx = hx * U * .02; vy = -hy * U * .02; }
      else { const sp = (r.type === 'willow' ? rnd(60, 190) : rnd(110, 200)) * sc; vx = Math.cos(a) * sp; vy = Math.sin(a) * sp; }
      const life = rnd(1.3, 2.1);
      sparks.push({ x: r.tx, y: r.ty, px: r.tx, py: r.ty, vx, vy, life, max: life, rgb: r.rgb, g: r.type === 'willow' ? 90 : 50 });
    }
  }
  function program() {
    [[1.2, 'peony'], [1.8, 'peony'], [2.4, 'willow'], [3.0, 'peony'], [3.7, 'heart'], [4.4, 'willow'], [5.0, 'peony'], [5.5, 'peony'], [6.2, 'heart'], [6.6, 'peony'], [6.8, 'willow'], [7.0, 'peony']]
      .forEach(([s, ty]) => setTimeout(() => launch(ty), s * 1000));
  }
  function shoot(delay = 0) {
    const a = rnd(.32, .55), sp = U * rnd(1.4, 2.2) + 300;
    shoots.push({ x: rnd(-.1, .85) * W, y: rnd(-.05, .22) * H, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t0: nowS() + delay, life: rnd(.9, 1.5), L: rnd(.09, .15) });
  }
  function shower(n, span) { for (let i = 0; i < n; i++) shoot(rnd(0, span)); }

  // ---------- frame ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    const k = Math.min(1, dt * .7);
    warm += (warmT - warm) * k; storm += (stormT - storm) * k; umb += (umbT - umb) * Math.min(1, dt * 1.2);

    for (const s of stars) { ctx.fillStyle = `rgba(255,244,225,${(.25 + .6 * (.5 + .5 * Math.sin(t * s.sp + s.ph))) * (1 - .85 * storm)})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); }
    if (warm > .01) {
      const g = ctx.createRadialGradient(W / 2, HOR, 0, W / 2, HOR, W * .95);
      g.addColorStop(0, `rgba(255,170,90,${.42 * warm})`); g.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    for (const l of ripples) { ctx.fillStyle = `rgba(190,225,255,${.06 + .04 * Math.sin(t * 1.4 + l.ph)})`; ctx.fillRect(l.x, l.y, l.w, 1.2); }
    for (const f of flies) {
      if (!reduce) { f.x += Math.sin(t * f.sp + f.ph) * .35; f.y -= f.sp * .25; if (f.y < H * .3) { f.y = H + 10; f.x = rnd(0, W); } }
      glow(f.x, f.y, 6, '255,214,140', (.2 + .5 * (.5 + .5 * Math.sin(t * 1.7 + f.ph * 3))) * .8);
    }
    if (t < boatsUntil && Math.random() < dt * 2.2) spawnBoat();
    boats = boats.filter((b) => b.x < W + 40);
    for (const b of boats) { b.x += b.vx * dt; b.vis = Math.min(1, b.vis + dt); drawBoat(b, b.y + Math.sin(t * 1.5 + b.ph) * 1.5); }
    if (storm > .01) { ctx.fillStyle = `rgba(10,25,52,${.4 * storm})`; ctx.fillRect(0, 0, W, H); }

    // rain (kept off the umbrella)
    const ux = W / 2, uy = H * .46, ur = U * .26;
    if (rainOn && !reduce) { const n = Math.min(40, Math.round(storm * dt * 850)); for (let i = 0; i < n; i++) rain.push({ x: rnd(-40, W + 80), y: -20, vy: rnd(900, 1300), len: rnd(12, 22), ground: rnd(HOR + 4, H) }); }
    if (rain.length) {
      ctx.strokeStyle = 'rgba(190,215,255,.4)'; ctx.lineWidth = 1; ctx.beginPath();
      rain = rain.filter((r) => {
        r.x -= 120 * dt; r.y += r.vy * dt;
        if (r.y >= r.ground) { if (Math.random() < .3 && splashes.length < 60) splashes.push({ x: r.x, y: r.ground, t0: t }); return false; }
        const dx = r.x - ux, dry = umb > .3 && Math.abs(dx) < ur && r.y > uy - Math.sqrt(Math.max(0, ur * ur - dx * dx)) && r.y < uy + ur * 1.3;
        if (!dry) { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.len * .12, r.y - r.len); }
        return true;
      });
      ctx.stroke();
    }
    splashes = splashes.filter((s) => t - s.t0 < .5);
    for (const s of splashes) { const a = (t - s.t0) / .5; ctx.strokeStyle = `rgba(190,215,255,${.35 * (1 - a)})`; ctx.beginPath(); ctx.ellipse(s.x, s.y, 2 + a * 10, 1 + a * 3, 0, 0, 6.283); ctx.stroke(); }

    // umbrella
    if (umb > .01) {
      ctx.save(); ctx.globalAlpha = umb; ctx.translate(ux, uy); ctx.rotate(Math.sin(t * .9) * .03);
      glow(0, -ur * .3, ur * 1.7, '255,140,170', .2);
      const n = 4, w = ur * 2 / n;
      ctx.beginPath(); ctx.arc(0, 0, ur, Math.PI, 0);
